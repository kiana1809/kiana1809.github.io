<!DOCTYPE html>
<html lang="id">
  <head>
    <title>.:: Katalog Produk Freeze-Dried ::.</title>
  </head>
  <body>

    <h1 align="center">Produk Kami</h1>
    <table border="1" align="center">
      <tr>
        <td align="center">
          <img src="bolaobicilembu.jpg" width="231" height="217"><br>
          <b>bola obi cilembu Rp.2.000/bola</b>
        </td>
        <td align="center">
          <img src="bolaobiungu.jpg" width="231" height="217"><br>
          <b>bola obi unggu Rp.2.000/bola</b>
        </td>
      </tr>
      <tr>

    </table>

    <br>

    <!-- Form berjejer ke samping -->
    <form action="#" method="get" align="center">
      
      <!-- Jumlah -->
      <label for="angka">Jumlah Produk:</label>
      <input type="number" id="angka" name="angka" min="1" max="2" step="1" value="5">

      &nbsp;&nbsp;

      <!-- Varian -->
      <label for="rasa">Varian:</label>
      <select id="rasa" name="rasa">
        <option value="Bola obi cilembu">Ubi cilembu</option>
        <option value="bola obi unggu">Ubi unggu</option>
      </select>

      &nbsp;&nbsp;

      <!-- Tombol Kirim -->
      <button type="submit">Kirim</button>

    </form>

  </body>
</html>
